<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FlowupS Loading</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100%;
  height:100vh;
  overflow:hidden;
  font-family:Segoe UI, Arial, sans-serif;
  background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

.wrapper{
  text-align:center;
}

.logo{
  width:95px;
  height:95px;
  border-radius:24px;
  padding:14px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(8px);
  box-shadow:0 15px 40px rgba(0,0,0,0.35);
  animation:float 2s ease-in-out infinite;
}

h1{
  margin-top:20px;
  font-size:30px;
  letter-spacing:1px;
  font-weight:700;
}

p{
  margin-top:8px;
  color:#cbd5e1;
  font-size:14px;
}

.loader{
  width:220px;
  height:6px;
  background:rgba(255,255,255,0.08);
  border-radius:50px;
  margin:30px auto 0;
  overflow:hidden;
}

.bar{
  width:40%;
  height:100%;
  background:linear-gradient(90deg,#38bdf8,#6366f1);
  border-radius:50px;
  animation:load 1.3s infinite ease-in-out;
}

.version{
  margin-top:22px;
  font-size:12px;
  color:#94a3b8;
}

@keyframes load{
  0%{transform:translateX(-120px);}
  100%{transform:translateX(220px);}
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}
</style>
</head>

<body>

<div class="wrapper">

  <img src="./new logo.png" class="logo"/>

  <h1>FlowupS CallDesk</h1>
  <p>Preparing your workspace...</p>

  <div class="loader">
    <div class="bar"></div>
  </div>

  <div class="version">Desktop Edition</div>

</div>

</body>
</html>
